name: Contrato real WireMock
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contrato:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercitar todos os mapeamentos usando WireMock local
        run: python -m unittest discover -s tests -p 'test_*.py' -v
